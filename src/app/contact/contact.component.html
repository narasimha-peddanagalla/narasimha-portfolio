      <form (submit)="sendEmail(); $event.preventDefault();">
  <div class="mb-3">
    <label for="fromEmail" class="form-label">Your Email</label>
    <input [(ngModel)]="fromEmail" name="fromEmail" type="email" class="form-control" id="fromEmail" placeholder="your-email@example.com" required>
  </div>

  <div class="mb-3">
    <label for="message" class="form-label">Message</label>
    <textarea [(ngModel)]="message" name="message" class="form-control" id="message" rows="5" placeholder="Type your message here..." required></textarea>
  </div>

  <button type="submit" class="btn btn-warning px-4 fw-bold">Send</button>

  <div class="mt-3">
    <p class="text-success" *ngIf="successMessage">{{ successMessage }}</p>
    <p class="text-danger" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>
</form>
